<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Calidad MOV OUT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ===== Tema corporativo Movistar x A365 (misma estructura que Calidad Outbound Claro) ===== */
:root{
  --mv-blue:#019DF4;--mv-navy:#0B2739;--mv-green:#5BC500;
  --display:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#f4f6f9;--panel:#ffffff;--soft:#e5f5fe;--ink:#1b2430;--ink2:#5f6b7a;--muted:#5f6b7a;--line:#e2e7ee;--track:#e2e7ee;
  --ok:#1a8f4c;--ok-soft:#e3f5ea;--mid:#b7791f;--mid-soft:#fdf3e1;--bad:#c53030;--bad-soft:#fde8e8;--shadow:none;
  --b-neg:#0B2739;--b-venta:#019DF4;--b-cierre:#5BC500;--b-exp:#8b5cf6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161d;--panel:#1a212b;--soft:#16304a;--ink:#e7edf4;--ink2:#9aa7b6;--muted:#9aa7b6;--line:#2a3340;--track:#2a3340;
  --ok:#4cc283;--ok-soft:#163526;--mid:#e3a94b;--mid-soft:#3a2e17;--bad:#f07171;--bad-soft:#3d1d1d;
  --b-neg:#4ea1f3;--b-venta:#33c4ff;--b-cierre:#7ad62b;--b-exp:#a78bfa;}}
:root[data-theme="dark"]{
  --bg:#11161d;--panel:#1a212b;--soft:#16304a;--ink:#e7edf4;--ink2:#9aa7b6;--muted:#9aa7b6;--line:#2a3340;--track:#2a3340;
  --ok:#4cc283;--ok-soft:#163526;--mid:#e3a94b;--mid-soft:#3a2e17;--bad:#f07171;--bad-soft:#3d1d1d;
  --b-neg:#4ea1f3;--b-venta:#33c4ff;--b-cierre:#7ad62b;--b-exp:#a78bfa;}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--body)}
.wrap{max-width:1500px;margin:0 auto;padding:0 20px}
/* encabezado inicial */
header.top{background:linear-gradient(100deg,#0B2739 0%,#0A4F86 55%,#019DF4 100%);color:#fff;border-bottom:4px solid #5BC500;padding:16px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
header.top h1{font-size:19px;margin:0;letter-spacing:.2px;font-weight:700}
header.top .sub{color:rgba(255,255,255,.8);font-size:12px}
header.top .miss{color:#ffd1d1}
header.top button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
header.top button.pri{background:#5BC500;border-color:#5BC500;color:#0B2739;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.f{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.f select{min-width:130px}.f.meta input{width:80px}
select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px}
button.pri{background:var(--mv-blue);border-color:var(--mv-blue);color:#fff}
:focus-visible{outline:2px solid var(--mv-blue);outline-offset:1px}
.count{font-size:12px;color:var(--muted);align-self:flex-end;margin-left:auto;padding-bottom:6px}
nav#tabs{display:flex;gap:4px;padding:10px 20px 0;overflow-x:auto;max-width:1500px;margin:0 auto}
nav#tabs button{border:none;background:none;padding:8px 12px;border-radius:8px 8px 0 0;color:var(--muted);white-space:nowrap}
nav#tabs button.on{background:var(--panel);color:var(--mv-blue);font-weight:600;box-shadow:inset 0 -2px 0 var(--mv-blue)}
.miss{color:var(--bad)}
/* contenido */
main{padding:16px 20px 40px;max-width:1500px}
section{margin-top:0}
section+section{margin-top:28px}
h2{font-size:17px;font-weight:700;margin:0 0 4px;color:var(--ink)}

h3{font-size:14px;font-weight:700;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 14px;font-size:14px;max-width:85ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.hero{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:26px;align-items:center}
.herolab{font:600 12px/1.3 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font:700 64px/.95 var(--display);letter-spacing:-1px}.big small{font-size:34px;font-weight:600}
.badge{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:600;margin-left:6px}
.stack{display:flex;height:74px;border-radius:8px;overflow:hidden;gap:3px;background:var(--soft)}
.seg{position:relative;background:var(--track);min-width:0}
.seg .fill{position:absolute;top:0;left:0;bottom:0;transition:width .5s ease}
.seg .t{position:absolute;left:8px;top:6px;right:6px;font-size:12px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.seg .v{position:absolute;left:8px;bottom:5px;font:600 22px/1 var(--display);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.scale{display:flex;gap:3px;font-size:12px;color:var(--muted);margin-top:4px}
.note{font-size:13px;color:var(--muted);max-width:90ch}
.pecs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:18px}
.pec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel);border-top:4px solid var(--c);box-shadow:var(--shadow)}
.pec .n{font-weight:600;font-size:14px}.pec .p{font:700 40px/1.05 var(--display);margin-top:4px}.pec .d{font-size:13px;color:var(--muted)}
.mini{height:6px;background:var(--track);border-radius:3px;margin-top:8px;overflow:hidden}.mini i{display:block;height:100%;background:var(--c)}
.kpis{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-top:14px;box-shadow:var(--shadow)}
.kpi{padding:12px 14px;border-left:1px solid var(--line)}.kpi:first-child{border-left:0}
.kpi .l{font-size:12.5px;color:var(--muted)}.kpi .v{font:600 30px/1.1 var(--display)}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ins{border-left:4px solid var(--c,var(--mv-blue));background:var(--panel);border-radius:0 10px 10px 0;padding:10px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.ins .l{font-size:12.5px;color:var(--muted)}.ins .v{font-weight:600;font-size:16px}.ins .x{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.chart{position:relative;height:300px}
.tw{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--panel);color:var(--muted);font-size:12px;font-weight:600;position:sticky;top:0;cursor:pointer;user-select:none;vertical-align:bottom;white-space:normal;min-width:64px;z-index:1}
th.s-asc::after{content:" ▲";font-size:9px}th.s-desc::after{content:" ▼";font-size:9px}
td:first-child,th:first-child{text-align:left}
td.l,th.l{text-align:left}
td.wrap{white-space:normal;min-width:260px;text-align:left}
tr.tot td{font-weight:700;background:var(--soft)}
tbody tr:hover td{background:var(--soft)}
tr.ev{cursor:pointer}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.mid{background:var(--mid-soft);color:var(--mid)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card .l{font-size:12px;color:var(--muted)}.card .v{font-size:24px;font-weight:700;margin-top:2px}.card .s{font-size:11px;color:var(--muted)}
.dl{display:block;font-size:12.5px;font-weight:600;margin-top:2px;color:var(--muted)}.dl.up{color:var(--ok)}.dl.down{color:var(--bad)}
.dl b{font-weight:600;color:var(--muted)}
td .dl{display:inline;margin:0}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.tools label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tools select,.tools input{width:auto}
.empty{padding:40px;text-align:center;color:var(--muted)}
.lock{max-width:380px;margin:0 auto;text-align:center}
.lock input{margin:10px 0}
.err{color:var(--bad);min-height:18px;font-size:13px}
dialog{width:min(1240px,96vw);max-height:90vh;border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,22,.55)}
dialog .tw{max-height:calc(90vh - 200px)}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
a{color:var(--mv-blue)}
@media (max-width:1100px){.pecs{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}.kpi:nth-child(5){border-left:0}.kpi:nth-child(n+5){border-top:1px solid var(--line)}}
@media (max-width:820px){.bar{position:static}.hero{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.big{font-size:68px}.seg .t{display:none}}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .cx-in{grid-template-columns:1fr 1fr;gap:10px 12px;padding:12px 16px}
  .cx-tt{grid-column:1/-1;grid-row:2;padding-left:0;border-left:0}
  .mv-mark{font-size:26px}.cx-logo.a365{height:40px;justify-self:end}
  .pecs{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.kpi{border-left:0;border-top:1px solid var(--line)}.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(even){border-left:1px solid var(--line)}
  .f{max-width:none;flex-basis:45%}.chart{height:260px}.stack{height:60px}.seg .v{font-size:15px;left:4px}
  .cx-fin .cx-r{margin-left:0}
}
</style>
</head>
<body>
<header class="top">
  <div><h1>Dashboard de Calidad · Movistar MX OUT</h1><div class="sub" id="subt">Cargando respuestas del forms…</div></div>
  <div style="display:flex;gap:8px"><button type="button" id="btnTheme" title="Cambiar tema" aria-label="Cambiar tema">◐</button><button type="button" class="pri" id="btnRef">↻ Actualizar</button></div>
</header>
<div class="filters" id="filters"></div>
<nav id="tabs"></nav>
<main class="wrap" id="main" style="margin:0 auto"><div class="empty">Cargando…</div></main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dhead"><div><h2 id="dlgTitle"></h2><p class="lead" id="dlgSub"></p></div><button type="button" class="pri" id="dlgClose">Cerrar</button></div>
  <div id="dlgBody"></div>
</dialog>



<script>
/* ===== Pauta de calidad ===== */
var ITEMS = [
  ['Pregunta Rompehielo','neg',2,15],['Fluidez de la llamada','neg',2,10],['Correcta información','neg',2,15],['Detección de necesidades','neg',2,10],['Manejo de Objeción','neg',2,15],
  ['Oferta del plan correcto','venta',5,0],['Validación de datos de portabilidad','venta',8,0],['Claridad de la información','venta',8,0],['Cierre con aceptación expresa','venta',10,0],['Solicita autorización de CURP','venta',10,0],['Aviso de privacidad','venta',10,0],['Ofrece promocional tangible','venta',20,0],
  ['Solicitud de Referidos','cierre',2,7],['Despedida profesional','cierre',2,5],['Correcta Tipificación en Discador','cierre',5,7],
  ['Lenguaje correcto, simple y claro','exp',4,8],['Clima cordial y proyectar seguridad','exp',4,8]
];
var BLOQ = [['neg','Negociación','--b-neg'],['venta','Venta','--b-venta'],['cierre','Cierre de venta','--b-cierre'],['exp','Experiencia cliente','--b-exp']];
var BLOQUES = {neg:'Negociación',venta:'Venta',cierre:'Cierre de venta',exp:'Experiencia cliente'};
var HABS = ['Saludo','Sondeo','Argumentación','Rebate','Cierre'];
var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

/* ===== Estado ===== */
var D = null, MON = null, CLAVE = null, charts = [], META = 85, P = null, TAB = 'resumen';
var TABS = [['resumen','Resumen'],['pauta','Pauta por ítem'],['semanal','Semanal'],['errores','Errores / Pareto'],['agentes','Agentes'],['causa','Causa raíz'],['feedback','Feedback'],['monitoreo','\uD83D\uDD12 Monitoreo'],['metodo','Metodología']];
var F = { mes:'', sem:'', campana:'', supervisor:'', evaluador:'', tipo:'', tipoEval:'' };
var FM = { supervisor:'', campana:'', solo:'' };
try { var m0 = +localStorage.getItem('mv_meta'); if (m0 > 0 && m0 <= 100) META = m0; } catch (e) {}

/* ===== Utilidades ===== */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pct(x,d){return x==null||isNaN(x)?'–':(x*100).toFixed(d==null?1:d)+'%';}
function avg(a){a=a.filter(function(x){return x!=null&&!isNaN(x);});return a.length?a.reduce(function(s,x){return s+x;},0)/a.length:null;}
function sum(a){return a.reduce(function(s,x){return s+(+x||0);},0);}
function cls(x){var m=META/100;return x==null?'':x>=m?'ok':x>=m-0.15?'mid':'bad';}
function pill(x){return x==null?'<span class="muted">–</span>':'<span class="pill '+cls(x)+'">'+pct(x)+'</span>';}
function uniq(a){var o={};a.forEach(function(x){if(x)o[x]=1;});return Object.keys(o).sort();}
function groupBy(a,fn){var o={};a.forEach(function(x){var k=fn(x);(o[k]||(o[k]=[])).push(x);});return o;}
function mesLabel(m){return m?MESES[+m.slice(5,7)-1]+' '+m.slice(0,4):'';}
function mesActual(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function fdate(s){return s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';}
function count(a,fn){var o={};a.forEach(function(x){var k=fn(x);if(k)o[k]=(o[k]||0)+1;});return Object.keys(o).map(function(k){return [k,o[k]];}).sort(function(a,b){return b[1]-a[1];});}
function mesPrev(m){if(!m)return '';var y=+m.slice(0,4),mm=+m.slice(5,7)-1;if(mm<1){mm=12;y--;}return y+'-'+('0'+mm).slice(-2);}
// Variación en puntos porcentuales frente al mes anterior (verde si mejora)
function dPct(cur,prev,inv){
  if(!P||cur==null||prev==null)return '';var d=(cur-prev)*100;if(inv)d=-d;
  var c=Math.abs(d)<0.05?'eq':d>0?'up':'down',raw=(cur-prev)*100;
  return '<span class="dl '+c+'" title="'+esc(P.label)+': '+pct(prev)+'">'+(Math.abs(raw)<0.05?'= ':raw>0?'▲ ':'▼ ')+Math.abs(raw).toFixed(1)+' pp <b>vs '+esc(P.corto)+'</b></span>';
}
// Variación de cantidades (neutra)
function dNum(cur,prev){
  if(!P||prev==null)return '';var d=cur-prev;
  return '<span class="dl" title="'+esc(P.label)+': '+prev+'">'+(d===0?'= ':d>0?'▲ ':'▼ ')+Math.abs(d)+(prev?' ('+(d>0?'+':d<0?'−':'')+Math.abs(d/prev*100).toFixed(0)+'%)':'')+' <b>vs '+esc(P.corto)+'</b></span>';
}
function semLabel(k){var p=k.split('|');return mesLabel(p[0]).slice(0,3)+' S'+p[1];}

/* ===== Datos ===== */
function call(fn,arg){
  return new Promise(function(res,rej){
    var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    arg===undefined?r[fn]():r[fn](arg);
  });
}
function cargar(forzar){
  document.getElementById('subt').textContent='Cargando…';
  call(forzar?'refrescar':'getData').then(function(txt){
    D=JSON.parse(txt);
    if(!F.mes)F.mes=mesActual();
    pintarFiltros();render();
    if(CLAVE)cargarMon(CLAVE);
  }).catch(function(e){document.getElementById('main').innerHTML='<div class="empty"><b>No se pudieron leer los datos</b><br>'+esc(e&&e.message||e)+'</div>';});
}
function evaF(mes){if(mes===undefined)mes=F.mes;return D.eva.filter(function(e){
  return (!mes||e.mes===mes)&&(!F.sem||e.sem==F.sem)&&(!F.campana||e.campana===F.campana)&&(!F.supervisor||e.supervisor===F.supervisor)&&(!F.evaluador||e.evaluador===F.evaluador)&&(!F.tipo||e.tipo===F.tipo)&&(!F.tipoEval||e.tipoEval===F.tipoEval);});}
function fbF(mes){if(mes===undefined)mes=F.mes;return D.fb.filter(function(f){
  return (!mes||f.mes===mes)&&(!F.sem||f.sem==F.sem)&&(!F.campana||f.campana===F.campana)&&(!F.supervisor||f.supervisor===F.supervisor)&&(!F.evaluador||f.evaluador===F.evaluador);});}

function resumen(a){
  var g=function(k){return avg(a.map(function(e){return e[k];}));};
  return {n:a.length,nota:g('nota'),pec:g('pec'),neg:g('cNeg'),venta:g('cVenta'),cierre:g('cCierre'),exp:g('cExp'),uf:g('uf'),ecNeg:g('ecNeg'),ecCum:g('ecCum'),enc:g('enc'),fb:g('fb')};
}
// Puntos logrados por bloque (sumando el peso si Cumple o No aplica, como la nota ponderada)
function bloques(a){
  var o={};BLOQ.forEach(function(b){o[b[0]]={ok:0,max:0};});
  a.forEach(function(e){var v=e.tipo==='Venta';ITEMS.forEach(function(it,i){if(it[1]==='venta'&&!v)return;var w=v?it[2]:it[3];o[it[1]].max+=w;if(e.items.charAt(i)!=='N')o[it[1]].ok+=w;});});
  var n=a.length||1;BLOQ.forEach(function(b){o[b[0]].ok/=n;o[b[0]].max/=n;});return o;
}
function statsItems(a){
  return ITEMS.map(function(it,i){
    var c=0,n=0,na=0;a.forEach(function(e){if(it[1]==='venta'&&e.tipo!=='Venta')return;var v=e.items.charAt(i);if(v==='C')c++;else if(v==='N')n++;else na++;});
    var tot=c+n+na;
    return {nombre:it[0],bloque:it[1],c:c,n:n,na:na,p:(c+n)?c/(c+n):null,q:(c+n)?n/(c+n):null,pna:tot?na/tot:null,pv:it[2],pnv:it[3]};
  });
}

/* ===== Filtros ===== */
function pintarFiltros(){
  var e=D.eva,f=D.fb;
  var defs=[['mes','Mes',uniq(e.map(function(x){return x.mes;}).concat(f.map(function(x){return x.mes;}),[mesActual()])).reverse(),mesLabel],
    ['sem','Semana',['1','2','3','4','5'],function(s){return 'Semana '+s;}],
    ['campana','Campaña',uniq(e.map(function(x){return x.campana;}))],
    ['supervisor','Supervisor',uniq(e.map(function(x){return x.supervisor;}))],
    ['evaluador','Evaluador',uniq(e.map(function(x){return x.evaluador;}).concat(f.map(function(x){return x.evaluador;})))],
    ['tipo','Tipo de llamada',['Venta','No Venta']],
    ['tipoEval','Tipo de monitoreo',uniq(e.map(function(x){return x.tipoEval;}))]];
  document.getElementById('filters').innerHTML=defs.map(function(d){
    return '<label class="f">'+d[1]+'<select data-f="'+d[0]+'"><option value="">Todos</option>'+d[2].map(function(v){return '<option value="'+esc(v)+'"'+(String(F[d[0]])===v?' selected':'')+'>'+esc(d[3]?d[3](v):v)+'</option>';}).join('')+'</select></label>';
  }).join('')+'<label class="f meta">Meta (%)<input id="meta" type="number" min="1" max="100" value="'+META+'"></label>'+
  '<label class="f">&nbsp;<button type="button" id="btnClr">Limpiar</button></label><span class="count" id="count"></span>';
  document.querySelectorAll('[data-f]').forEach(function(s){s.onchange=function(){F[s.dataset.f]=s.value;render();};});
  document.getElementById('meta').onchange=function(){var v=+this.value;if(v>0&&v<=100){META=v;try{localStorage.setItem('mv_meta',v);}catch(e){}render();}};
  document.getElementById('btnClr').onclick=function(){Object.keys(F).forEach(function(k){F[k]='';});F.mes=mesActual();pintarFiltros();render();};
}

/* ===== Render ===== */
function tabla(head,rows,total,id){

function activarOrden(root){
  (root||document).querySelectorAll('table').forEach(function(t){
    t.querySelectorAll('th').forEach(function(th,i){th.onclick=function(){
      var tb=t.tBodies[0];if(!tb)return;var rows=[].slice.call(tb.rows).filter(function(r){return r.cells.length>i;});var asc=!th.classList.contains('s-asc');
      t.querySelectorAll('th').forEach(function(x){x.classList.remove('s-asc','s-desc');});th.classList.add(asc?'s-asc':'s-desc');
      rows.sort(function(a,b){var x=a.cells[i].dataset.v!=null?a.cells[i].dataset.v:a.cells[i].textContent,y=b.cells[i].dataset.v!=null?b.cells[i].dataset.v:b.cells[i].textContent;
        var nx=parseFloat(String(x).replace('%','')),ny=parseFloat(String(y).replace('%',''));

/* --- Resumen --- */
function sResumen(a,fb){
  if(!a.length&&!fb.length)return '<section id="resumen"><div class="panel empty">Sin evaluaciones para los filtros seleccionados.</div></section>';
  var r=resumen(a),b=bloques(a),m=META/100;
  var totMax=sum(BLOQ.map(function(x){return b[x[0]].max;}))||1;
  var stack=BLOQ.filter(function(x){return b[x[0]].max>0;}).map(function(x){var o=b[x[0]];return '<div class="seg" style="flex:'+o.max+'" title="'+x[1]+': '+o.ok.toFixed(1)+' de '+o.max.toFixed(1)+' pts"><div class="fill" style="width:'+(o.ok/o.max*100)+'%;background:var('+x[2]+')"></div><span class="t">'+x[1]+'</span><span class="v">'+o.ok.toFixed(1)+'/'+o.max.toFixed(1)+'</span></div>';}).join('');
  var scale=BLOQ.filter(function(x){return b[x[0]].max>0;}).map(function(x){return '<span style="flex:'+b[x[0]].max+'">'+Math.round(b[x[0]].max/totMax*100)+' pts</span>';}).join('');
  var pec=function(n,v,d,c,pv){return '<div class="pec" style="--c:var('+c+')"><div class="n">'+n+'</div><div class="p">'+pct(v)+'</div>'+dPct(v,pv)+'<div class="d">'+d+'</div><div class="mini"><i style="width:'+((v||0)*100)+'%"></i></div></div>';};
  var kpi=function(l,v,dl){return '<div class="kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(dl||'')+'</div>';};
  var pr=P?P.r:{};
  var ventas=a.filter(function(e){return e.tipo==='Venta';}).length;
  var porAg=groupBy(a,function(e){return e.agente;});
  var bajo=Object.keys(porAg).filter(function(k){return avg(porAg[k].map(function(e){return e.nota;}))<m;}).length;
  // Lectura rápida
  var st=statsItems(a).filter(function(s){return s.n>0;}).sort(function(x,y){return y.n-x.n;});
  var sups=groupBy(a,function(e){return e.supervisor||'(sin supervisor)';});
  var supR=Object.keys(sups).map(function(k){return [k,resumen(sups[k])];}).filter(function(x){return x[1].n>=3;}).sort(function(x,y){return x[1].nota-y[1].nota;});
  var obj=count(a,function(e){return e.objecion&&e.objecion!=='NO APLICA'&&e.objecion!=='VENTA'?e.objecion:'';});
  var sinFb=a.filter(function(e){return !e.fb&&e.items.indexOf('N')>=0;}).length;
  var ins=function(l,v,x,c){return '<div class="ins" style="--c:var('+(c||'--mv-blue')+')"><div class="l">'+l+'</div><div class="v">'+v+'</div><div class="x">'+x+'</div></div>';};
  var insights=[
    st[0]?ins('Ítem con más quiebres',esc(st[0].nombre),st[0].n+' evaluaciones con "No cumple" · '+pct(st[0].q)+' de quiebre','--bad'):'',
    supR.length>1?ins('Supervisor con menor nota',esc(supR[0][0])+' · '+pct(supR[0][1].nota),'Mejor: '+esc(supR[supR.length-1][0])+' · '+pct(supR[supR.length-1][1].nota),'--b-neg'):'',
    obj[0]?ins('Objeción más frecuente',esc(obj[0][0]),obj[0][1]+' casos · '+pct(obj[0][1]/a.length)+' de las evaluaciones','--b-venta'):'',
    ins('Agentes bajo meta',bajo+' de '+Object.keys(porAg).length,'con nota promedio menor a '+META+'%'+(P?' · '+esc(P.corto)+': '+(function(){var g=groupBy(P.a,function(e){return e.agente;});return Object.keys(g).filter(function(k){return avg(g[k].map(function(e){return e.nota;}))<m;}).length+' de '+Object.keys(g).length;})():''),bajo?'--mid':'--ok'),
    ins('Feedback pendiente',sinFb+' evaluaciones','con algún "No cumple" y sin feedback registrado',sinFb?'--mid':'--ok')
  ].join('');
  // Tarjetas iniciales con los KPI principales y su variación frente al mes anterior
  var card=function(l,v,sub,dl,c){return '<div class="card"><div class="l">'+l+'</div><div class="v"'+(c?' style="color:var(--'+({ok:'ok',mid:'mid',bad:'bad'}[c])+')"':'')+'>'+v+'</div>'+(dl||'')+'<div class="s">'+(sub||'&nbsp;')+'</div></div>';};
  var pBajo=null;if(P){var gp=groupBy(P.a,function(e){return e.agente;});pBajo=Object.keys(gp).filter(function(k){return avg(gp[k].map(function(e){return e.nota;}))<m;}).length;}
  var pSinFb=P?P.a.filter(function(e){return !e.fb&&e.items.indexOf('N')>=0;}).length:null;
  var cards='<div class="cards">'+
    card('Evaluaciones',a.length,'Venta '+ventas+' · No venta '+(a.length-ventas),P&&dNum(a.length,P.a.length))+
    card('Nota calidad',pct(r.nota),'meta '+META+'%',dPct(r.nota,pr.nota),cls(r.nota))+
    card('PEC global',pct(r.pec),'UF '+pct(r.uf,0)+' · NEG '+pct(r.ecNeg,0)+' · CUM '+pct(r.ecCum,0),dPct(r.pec,pr.pec),cls(r.pec))+
    card('ENC',pct(r.enc),'Fluidez, despedida, clima',dPct(r.enc,pr.enc))+
    card('CUM Negociación',pct(r.neg),'sin "No cumple" en el bloque',dPct(r.neg,pr.neg),cls(r.neg))+
    card('CUM Venta',pct(r.venta),'solo llamadas de venta',dPct(r.venta,pr.venta),cls(r.venta))+
    card('CUM Cierre venta',pct(r.cierre),'',dPct(r.cierre,pr.cierre),cls(r.cierre))+
    card('CUM Exp. cliente',pct(r.exp),'',dPct(r.exp,pr.exp),cls(r.exp))+
    card('Agentes evaluados',Object.keys(porAg).length,'',P&&dNum(Object.keys(porAg).length,uniq(P.a.map(function(e){return e.agente;})).length))+
    card('Agentes bajo meta',bajo,'nota promedio < '+META+'%',P&&dNum(bajo,pBajo),bajo?'mid':'ok')+
    card('Feedbacks',fb.length,'',P&&dNum(fb.length,P.fb.length))+
    card('Evas con feedback',pct(r.fb),sinFb+' con errores sin feedback',dPct(r.fb,pr.fb))+
    '</div>';
  return '<section id="resumen">'+cards+'<div class="panel"><div class="hero">'+
    '<div><div class="herolab">Nota de calidad</div><div class="big">'+(r.nota==null?'–':(r.nota*100).toFixed(1)+'<small>%</small>')+'</div><div class="note">Promedio de la nota ponderada · meta '+META+'%'+(r.nota==null?'':'<span class="badge pill '+cls(r.nota)+'">'+(r.nota>=m?'En meta':'Bajo meta')+'</span>')+'</div>'+(P&&P.r.nota!=null?'<div style="margin-top:6px">'+dPct(r.nota,P.r.nota).replace('</b></span>',' ('+pct(P.r.nota)+')</b></span>')+'</div>':'')+'</div>'+
    '<div><div class="stack">'+stack+'</div><div class="scale">'+scale+'</div><div class="note" style="margin-top:8px">Puntos promedio logrados por bloque. Cada bloque ocupa el ancho de su peso en la pauta (cambia entre llamadas de venta y no venta); lo coloreado es lo logrado. "No aplica" suma el peso del ítem, igual que la nota ponderada.</div></div>'+
    '</div><div class="pecs">'+pec('PEC Usuario Final (UF)',r.uf,'Sin errores que afectan al cliente','--b-venta',pr.uf)+pec('PEC Negocio (NEG)',r.ecNeg,'Sin errores que afectan al negocio','--b-neg',pr.ecNeg)+pec('PEC Cumplimiento (CUM)',r.ecCum,'Referidos y tipificación','--b-cierre',pr.ecCum)+pec('ENC',r.enc,'Fluidez, despedida y clima','--b-exp',pr.enc)+pec('PEC global',r.pec,'Promedio UF·NEG·CUM, −10% si falla ENC','--mv-green',pr.pec)+'</div></div>'+
    '<h2 style="margin-top:26px">Lectura rápida</h2><p class="lead">Se recalcula con los filtros aplicados.</p><div class="insights">'+insights+'</div></section>';
}

/* --- Evolución --- */
function sTiempo(a,fb){
  var g=groupBy(a,function(e){return e.mes+'|'+e.sem;}),gf=groupBy(fb,function(f){return f.mes+'|'+f.sem;});
  var ks=uniq(Object.keys(g).concat(Object.keys(gf)));

  return '<section id="tiempo"><h2>Evolución semanal</h2><p class="lead">Semana del mes: días 1–7, 8–14, 15–21, 22–28 y 29–31.</p>'+
    '<div class="panel"><div class="chart"><canvas id="chEvo"></canvas></div></div><div style="margin-top:14px">'+
    tabla(['Semana'].concat(HEAD_RES,['# Feedbacks','Var. nota vs sem. anterior']),rows,filaRes('Total',resumen(a),'<td>'+fb.length+'</td><td></td>','tot'))+'</div></section>';
}

/* --- Campaña y supervisor --- */
function sSupervisor(a){
  var r=resumen(a),fc=function(e){return e.campana||'(sin campaña)';},fs=function(e){return e.supervisor||'(sin supervisor)';};
  var pc=groupBy(a,fc),ps=groupBy(a,fs),ppc=P?groupBy(P.a,fc):{},pps=P?groupBy(P.a,fs):{};
  var ext=function(prev,cur){if(!P)return '';var pr=prev&&prev.length?resumen(prev):null;return '<td data-v="'+(pr?pr.nota:'')+'">'+(pr?pct(pr.nota):'–')+'</td><td data-v="'+(pr&&cur.nota!=null?cur.nota-pr.nota:'')+'">'+(pr?dPct(cur.nota,pr.nota).replace(/ <b>.*<\/b>/,''):'–')+'</td>';};
  var head=HEAD_RES.concat(P?['Nota '+P.corto,'Var. nota']:[]);
  var fila=function(k,g,pg){var x=resumen(g[k]);return filaRes(k,x,ext(pg[k],x));};
  return '<section id="supervisor"><h2>Por campaña y supervisor</h2><p class="lead">CUM de bloque = evaluaciones sin ningún "No cumple" en ese bloque. CUM Venta solo considera llamadas de venta.'+(P?' Las dos últimas columnas comparan la nota con '+esc(P.label)+' (mismos filtros).':'')+'</p>'+
    tabla(['Campaña'].concat(head),Object.keys(pc).sort().map(function(k){return fila(k,pc,ppc);}),filaRes('Total general',r,ext(P&&P.a,r),'tot'))+
    '<div style="margin-top:14px">'+tabla(['Supervisor'].concat(head),Object.keys(ps).sort().map(function(k){return fila(k,ps,pps);}),filaRes('Total general',r,ext(P&&P.a,r),'tot'))+'</div></section>';
}

/* --- Ítems --- */
function sItems(a){
  var st=statsItems(a),rows=[];
  BLOQ.forEach(function(b){
    var blk=a.map(function(e){return b[0]==='neg'?e.cNeg:b[0]==='venta'?e.cVenta:b[0]==='cierre'?e.cCierre:e.cExp;});
    rows.push('<tr class="tot"><td class="l"><span class="pill" style="background:var('+b[2]+');color:#fff">'+b[1]+'</span></td><td></td><td></td><td>'+pill(avg(blk))+'</td><td></td><td></td><td></td><td></td></tr>');
    st.forEach(function(s){if(s.bloque!==b[0])return;var pp=s.q==null?null:s.q*(a.length?avg(a.map(function(e){return e.tipo==='Venta'?s.pv:s.pnv;})):0);
      rows.push('<tr><td class="l">&nbsp;&nbsp;'+esc(s.nombre)+'</td><td>'+s.pv+'</td><td>'+(s.pnv||'–')+'</td><td data-v="'+s.p+'">'+pill(s.p)+'</td><td data-v="'+s.q+'">'+pct(s.q)+'</td><td>'+s.n+'</td><td>'+(pp==null?'–':pp.toFixed(2))+'</td><td>'+pct(s.pna)+'</td></tr>');});
  });
  var sups=uniq(a.map(function(e){return e.supervisor;}));
  var heat=sups.map(function(sp){var x=statsItems(a.filter(function(e){return e.supervisor===sp;}));
    return '<tr><td class="l">'+esc(sp)+'</td>'+x.map(function(s){if(s.q==null)return '<td></td>';var al=Math.min(.85,s.q);return '<td style="background:rgba(210,59,47,'+al.toFixed(2)+');color:'+(al>.45?'#fff':'inherit')+'">'+pct(s.q,0)+'</td>';}).join('')+'</tr>';});
  return '<section id="items"><h2>Ítems de la pauta</h2><p class="lead">% cumple y % quiebre se calculan sobre las evaluaciones donde el ítem aplica (Cumple + No cumple). Puntos perdidos = peso promedio del ítem × % quiebre.</p>'+
    tabla(['Ítem','Peso venta','Peso no venta','% Cumple','% Quiebre','# No cumple','Pts perdidos','% No aplica'],rows)+
    '<div class="panel" style="margin-top:14px"><h3>Mapa de calor de quiebre por supervisor</h3><p class="note" style="margin-top:0">Celda vacía = el ítem no aplicó en ese grupo.</p>'+
    '<div class="tw" style="box-shadow:none"><table><thead><tr><th class="l">Supervisor</th>'+ITEMS.map(function(it){return '<th style="min-width:70px;font-size:10.5px;text-transform:none;letter-spacing:0">'+esc(it[0])+'</th>';}).join('')+'</tr></thead><tbody>'+heat.join('')+'</tbody></table></div></div></section>';
}

/* --- Errores --- */
function sErrores(a){
  var st=statsItems(a).filter(function(x){return x.n>0;}).sort(function(x,y){return y.n-x.n;}),tot=sum(st.map(function(x){return x.n;})),acc=0;
  var prevSt=P?statsItems(P.a):[];
  var rows=st.map(function(x){acc+=x.n;var pv=prevSt.filter(function(y){return y.nombre===x.nombre;})[0];
    return '<tr><td class="l">'+esc(x.nombre)+'</td><td class="l">'+BLOQUES[x.bloque]+'</td><td>'+x.n+'</td><td>'+pct(x.n/tot)+'</td><td>'+pct(acc/tot)+'</td><td>'+pct(x.q)+'</td>'+
      (P?'<td>'+(pv&&pv.q!=null?pct(pv.q):'–')+'</td><td>'+(pv&&pv.q!=null?dPct(x.q,pv.q,true).replace(/ <b>.*<\/b>/,''):'–')+'</td>':'')+'</tr>';});
  var sups=uniq(a.map(function(e){return e.supervisor;}));
  var rows2=sups.map(function(sp){var x=a.filter(function(e){return e.supervisor===sp;}),stx=statsItems(x),bl={neg:0,venta:0,cierre:0,exp:0};stx.forEach(function(i){bl[i.bloque]+=i.n;});var top=stx.slice().sort(function(p,q){return q.n-p.n;})[0];
    return '<tr><td class="l">'+esc(sp)+'</td><td>'+x.length+'</td><td>'+bl.neg+'</td><td>'+bl.venta+'</td><td>'+bl.cierre+'</td><td>'+bl.exp+'</td><td>'+(bl.neg+bl.venta+bl.cierre+bl.exp)+'</td><td class="l">'+(top&&top.n?esc(top.nombre)+' ('+top.n+')':'')+'</td></tr>';});
  return '<section><h2>Errores y Pareto</h2><p class="lead">Ítems con "No cumple" de mayor a menor; los que suman el 80% concentran el esfuerzo de mejora.'+(P?' "Var." compara el % de quiebre con '+esc(P.label)+' (verde = menos quiebres).':'')+'</p>'+
    '<div class="panel"><h3>Pareto de errores</h3><div class="chart" style="height:380px"><canvas id="chPar"></canvas></div></div>'+
    '<div class="grid2" style="margin-top:14px"><div><h3># Errores por ítem</h3>'+tabla(['Ítem','Bloque','Q','%','% Acumulado','% Quiebre'].concat(P?['Quiebre '+P.corto,'Var.']:[]),rows)+'</div>'+
    '<div><h3>Errores por supervisor</h3>'+tabla(['Supervisor','# Evas','Negociación','Venta','Cierre','Exp.','Total','Error más frecuente'],rows2)+'</div></div></section>';
}

/* --- Agentes --- */
function sAgentes(a){
  var g=groupBy(a,function(e){return e.agente;}),pg=P?groupBy(P.a,function(e){return e.agente;}):{};
  var rows=Object.keys(g).map(function(k){var x=g[k],r=resumen(x),st=statsItems(x).sort(function(p,q){return q.n-p.n;})[0],ult=x.map(function(e){return e.fecha;}).sort().pop(),pr=pg[k]?resumen(pg[k]):null;

/* ===== Monitoreo (con clave validada en el servidor) ===== */
function cargarMon(clave){
  var err=document.getElementById('lockErr');if(err)err.textContent='Validando…';
  return call('getMonitoreo',clave).then(function(txt){
    var r=JSON.parse(txt);
    if(!r.ok){CLAVE=null;MON=null;if(err)err.textContent=r.error;return;}
    CLAVE=clave;MON=r.data;pintarMon();
  }).catch(function(e){if(err)err.textContent=e&&e.message||String(e);});
}
function pintarMon(){
  var box=document.getElementById('monBody');if(!box)return;
  if(!MON){
    box.innerHTML='<div class="panel lock"><div style="font-size:30px">🔒</div><h3>Sección restringida</h3><p class="note">Ingresa la clave para ver el seguimiento de monitoreos.</p><input id="pass" type="password" placeholder="Clave" autocomplete="current-password"><button type="button" class="pri" id="btnPass" style="width:100%">Entrar</button><div class="err" id="lockErr"></div></div>';
    var i=document.getElementById('pass');document.getElementById('btnPass').onclick=function(){cargarMon(i.value);};i.onkeydown=function(e){if(e.key==='Enter')cargarMon(i.value);};return;
  }
  var mes=F.mes||mesActual();
  var ag=MON.agentes.filter(function(x){return x.mes===mes&&(!FM.supervisor||x.supervisor===FM.supervisor)&&(!FM.campana||x.campana===FM.campana);});
  var tot={prog:0,real:0,v:0,nv:0},rows=[];

      var c=s.prog?(r>=s.prog?'ok':r>0?'mid':'bad'):(r?'ok':'');return '<td data-v="'+r+'">'+(s.prog||r?'<span class="pill '+c+'">'+r+'/'+s.prog+'</span>':'')+'</td>';}).join('');

    '<div class="kpis" style="grid-template-columns:repeat(5,1fr)">'+kpi('Evas programadas',tot.prog)+kpi('Evas realizadas',tot.real)+kpi('Pendientes',Math.max(0,tot.prog-tot.real))+kpi('Cumplimiento',pct(cump))+kpi('Feedback pendiente',pend.length)+'</div>'+
    '<div style="margin-top:14px"><h3>Control de evaluaciones por agente (realizadas / programadas, '+MON.progSemana+' por semana)</h3>'+tabla(['Agente','Campaña','Supervisor','Estado','Sem 1','Sem 2','Sem 3','Sem 4','Sem 5','Prog.','Realiz.','Venta','No venta','Pendiente','Cumpl.','Con feedback'],rows)+'</div>'+
    '<div class="grid2" style="margin-top:14px"><div><h3>Productividad monitor por semana</h3>'+tabla(['Semana','Monitor','Días','Objetivo','# Evas','# Feedbacks','Cumpl. feedback','Cumpl. evas'],rowsS)+'</div>'+

document.getElementById('btnTheme').onclick=function(){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';render();};
document.getElementById('dlgClose').onclick=function(){document.getElementById('dlg').close();};
document.getElementById('dlg').addEventListener('click',function(e){if(e.target===this)this.close();});
cargar(false);
</script>
</body>
