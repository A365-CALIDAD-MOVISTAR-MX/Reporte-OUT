<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Calidad MOV OUT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --ink:#1b2430; --muted:#5f6b7a; --line:#e2e7ee;
  --brand:#019DF4; --brand-soft:#e5f5fe;
  --good:#1a8f4c; --good-soft:#e3f5ea; --warn:#b7791f; --warn-soft:#fdf3e1; --bad:#c53030; --bad-soft:#fde8e8;
  --c1:#019DF4; --c2:#5BC500; --c3:#e08a1e; --c4:#8b5cf6; --c5:#d6456b; --c6:#5f6b7a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161d; --card:#1a212b; --ink:#e7edf4; --muted:#9aa7b6; --line:#2a3340;
    --brand:#4ea1f3; --brand-soft:#16304a;
    --good:#4cc283; --good-soft:#163526; --warn:#e3a94b; --warn-soft:#3a2e17; --bad:#f07171; --bad-soft:#3d1d1d;
    --c1:#4ea1f3; --c2:#7ad62b; --c3:#f0a54a; --c4:#a78bfa; --c5:#f0708f; --c6:#9aa7b6;
  }
}
:root[data-theme="dark"]{
  --bg:#11161d; --card:#1a212b; --ink:#e7edf4; --muted:#9aa7b6; --line:#2a3340;
  --brand:#4ea1f3; --brand-soft:#16304a;
  --good:#4cc283; --good-soft:#163526; --warn:#e3a94b; --warn-soft:#3a2e17; --bad:#f07171; --bad-soft:#3d1d1d;
  --c1:#4ea1f3; --c2:#7ad62b; --c3:#f0a54a; --c4:#a78bfa; --c5:#f0708f; --c6:#9aa7b6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(100deg,#0B2739 0%,#0A4F86 55%,#019DF4 100%);color:#fff;border-bottom:4px solid #5BC500;padding:16px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
h1{font-size:19px;margin:0;letter-spacing:.2px}
.sub{color:var(--muted);font-size:12px}
header .sub{color:rgba(255,255,255,.8)}
header .miss{color:#ffd1d1}
header button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
header button.primary{background:#5BC500;border-color:#5BC500;color:#0B2739;font-weight:600}
button,select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.filters label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:2px}
.filters select{min-width:130px}
nav{display:flex;gap:4px;padding:10px 20px 0;overflow-x:auto}
nav button{border:none;background:none;padding:8px 12px;border-radius:8px 8px 0 0;color:var(--muted);white-space:nowrap}
nav button.on{background:var(--card);color:var(--brand);font-weight:600;box-shadow:inset 0 -2px 0 var(--brand)}
main{padding:16px 20px 40px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-size:14px}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .s{font-size:11px;color:var(--muted)}
.tbl{overflow:auto;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
th:first-child,td:first-child,td.t,th.t{text-align:left}
td.wrap{white-space:normal;min-width:260px;text-align:left}
tr.total td{font-weight:700;background:var(--brand-soft)}
tbody tr:hover{background:var(--brand-soft)}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.g{background:var(--good-soft);color:var(--good)}.w{background:var(--warn-soft);color:var(--warn)}.b{background:var(--bad-soft);color:var(--bad)}
.chart{position:relative;height:280px}
.muted{color:var(--muted)}
.hide{display:none!important}
.center{display:flex;align-items:center;justify-content:center;min-height:50vh;flex-direction:column;gap:12px}
.lock{max-width:360px;margin:60px auto;text-align:center}
.lock input{width:100%;margin:10px 0;padding:10px}
.err{color:var(--bad);min-height:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:20;overflow:auto}
.modal .card{max-width:1100px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px}
a{color:var(--brand)}
.miss{color:var(--bad);font-size:12px}
@media (max-width:640px){
  header,.filters,nav,main{padding-left:16px;padding-right:16px}
  .two{grid-template-columns:1fr}
  .filters select{min-width:0;width:100%}
  .filters label{flex:1 1 45%}
}
</style>
</head>
<body>
<header>
  <div><h1>Dashboard de Calidad · Movistar MX OUT</h1><div class="sub" id="upd">Cargando…</div></div>
  <div style="display:flex;gap:8px"><button id="btnTheme" title="Cambiar tema">◐</button><button id="btnRef" class="primary">↻ Actualizar</button></div>
</header>
<div class="filters" id="filters"></div>
<nav id="tabs"></nav>
<main id="main"><div class="center"><div>Cargando respuestas del forms…</div></div></main>
<div id="modal" class="modal hide"></div>

<script>
/* ===== Configuración visual ===== */
var UMBRAL = { bueno: 0.85, regular: 0.70 };
var ITEMS = [
  ['Pregunta Rompehielo','neg',2,15],['Fluidez de la llamada','neg',2,10],['Correcta información','neg',2,15],['Detección de necesidades','neg',2,10],['Manejo de Objeción','neg',2,15],
  ['Oferta del plan correcto','venta',5,0],['Validación de datos de portabilidad','venta',8,0],['Claridad de la información','venta',8,0],['Cierre con aceptación expresa','venta',10,0],['Solicita autorización de CURP','venta',10,0],['Aviso de privacidad','venta',10,0],['Ofrece promocional tangible','venta',20,0],
  ['Solicitud de Referidos','cierre',2,7],['Despedida profesional','cierre',2,5],['Correcta Tipificación en Discador','cierre',5,7],
  ['Lenguaje correcto, simple y claro','exp',4,8],['Clima cordial y proyectar seguridad','exp',4,8]
];
var BLOQUES = { neg:'Negociación', venta:'Venta', cierre:'Cierre de venta', exp:'Experiencia cliente' };
var HABS = ['Saludo','Sondeo','Argumentación','Rebate','Cierre'];
var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

/* ===== Estado ===== */
var D = null, MON = null, CLAVE = null, TAB = 'resumen', charts = [];
var F = { mes:'', sem:'', campana:'', supervisor:'', evaluador:'', tipo:'', tipoEval:'' };
var TABS = [['resumen','Resumen'],['pauta','Pauta por ítem'],['semanal','Semanal'],['errores','Errores / Pareto'],['agentes','Agentes'],['causa','Causa raíz'],['feedback','Feedback'],['monitoreo','🔒 Monitoreo']];

/* ===== Utilidades ===== */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pct(x,d){return x==null||isNaN(x)?'–':(x*100).toFixed(d==null?1:d)+'%';}
function avg(a){a=a.filter(function(x){return x!=null&&!isNaN(x);});return a.length?a.reduce(function(s,x){return s+x;},0)/a.length:null;}
function sum(a){return a.reduce(function(s,x){return s+(+x||0);},0);}
function cls(x){return x==null?'':x>=UMBRAL.bueno?'g':x>=UMBRAL.regular?'w':'b';}
function pill(x){return x==null?'<span class="muted">–</span>':'<span class="pill '+cls(x)+'">'+pct(x)+'</span>';}
function uniq(a){var o={};a.forEach(function(x){if(x)o[x]=1;});return Object.keys(o).sort();}
function groupBy(a,fn){var o={};a.forEach(function(x){var k=fn(x);(o[k]||(o[k]=[])).push(x);});return o;}
function mesLabel(m){return m?MESES[+m.slice(5,7)-1]+' '+m.slice(0,4):'';}
function mesActual(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function fdate(s){return s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';}
function count(a,fn){var o={};a.forEach(function(x){var k=fn(x);if(k)o[k]=(o[k]||0)+1;});return Object.keys(o).map(function(k){return [k,o[k]];}).sort(function(a,b){return b[1]-a[1];});}

/* ===== Datos ===== */
function call(fn,arg){
  return new Promise(function(res,rej){
    var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    arg===undefined?r[fn]():r[fn](arg);
  });
}
function cargar(forzar){
  document.getElementById('upd').textContent='Cargando…';
  call(forzar?'refrescar':'getData').then(function(txt){
    D=JSON.parse(txt);
    var meses=uniq(D.eva.map(function(e){return e.mes;}).concat(D.fb.map(function(f){return f.mes;})));
    if(!F.mes)F.mes=mesActual();
    var faltan=[];if(!D.hojas.eva)faltan.push('evaluaciones');if(!D.hojas.fb)faltan.push('feedback');
    document.getElementById('upd').innerHTML='Actualizado '+esc(D.actualizado)+' · '+D.eva.length+' evaluaciones · '+D.fb.length+' feedbacks'+(faltan.length?' · <span class="miss">No se encontró la hoja de '+faltan.join(' y ')+'</span>':'');
    if(CLAVE)cargarMon(CLAVE,true);
    pintarFiltros();render();
  }).catch(function(e){document.getElementById('main').innerHTML='<div class="center"><b>No se pudieron leer los datos</b><div class="muted">'+esc(e&&e.message||e)+'</div></div>';});
}

function evaF(){return D.eva.filter(function(e){
  return (!F.mes||e.mes===F.mes)&&(!F.sem||e.sem==F.sem)&&(!F.campana||e.campana===F.campana)&&(!F.supervisor||e.supervisor===F.supervisor)&&(!F.evaluador||e.evaluador===F.evaluador)&&(!F.tipo||e.tipo===F.tipo)&&(!F.tipoEval||e.tipoEval===F.tipoEval);});}
function fbF(){return D.fb.filter(function(f){
  return (!F.mes||f.mes===F.mes)&&(!F.sem||f.sem==F.sem)&&(!F.campana||f.campana===F.campana)&&(!F.supervisor||f.supervisor===F.supervisor)&&(!F.evaluador||f.evaluador===F.evaluador);});}

function resumen(a){
  return { n:a.length, nota:avg(a.map(function(e){return e.nota;})), pec:avg(a.map(function(e){return e.pec;})),
    neg:avg(a.map(function(e){return e.cNeg;})), venta:avg(a.map(function(e){return e.cVenta;})), cierre:avg(a.map(function(e){return e.cCierre;})), exp:avg(a.map(function(e){return e.cExp;})),
    uf:avg(a.map(function(e){return e.uf;})), ecNeg:avg(a.map(function(e){return e.ecNeg;})), ecCum:avg(a.map(function(e){return e.ecCum;})), enc:avg(a.map(function(e){return e.enc;})),
    fb:avg(a.map(function(e){return e.fb;})) };
}

/* ===== UI base ===== */
function pintarFiltros(){
  var e=D.eva, f=D.fb;
  var defs=[['mes','Mes',uniq(e.map(function(x){return x.mes;}).concat(f.map(function(x){return x.mes;}),[mesActual()])).reverse(),mesLabel],
    ['sem','Semana',['1','2','3','4','5'],function(s){return 'Semana '+s;}],
    ['campana','Campaña',uniq(e.map(function(x){return x.campana;}))],
    ['supervisor','Supervisor',uniq(e.map(function(x){return x.supervisor;}))],
    ['evaluador','Evaluador',uniq(e.map(function(x){return x.evaluador;}).concat(f.map(function(x){return x.evaluador;})))],
    ['tipo','Tipo llamada',['Venta','No Venta']],
    ['tipoEval','Tipo evaluación',uniq(e.map(function(x){return x.tipoEval;}))]];
  document.getElementById('filters').innerHTML=defs.map(function(d){
    return '<label>'+d[1]+'<select data-f="'+d[0]+'"><option value="">Todos</option>'+d[2].map(function(v){return '<option value="'+esc(v)+'"'+(String(F[d[0]])===v?' selected':'')+'>'+esc(d[3]?d[3](v):v)+'</option>';}).join('')+'</select></label>';
  }).join('')+'<label>&nbsp;<button id="btnClr">Limpiar</button></label>';
  document.querySelectorAll('[data-f]').forEach(function(s){s.onchange=function(){F[s.dataset.f]=s.value;render();};});
  document.getElementById('btnClr').onclick=function(){Object.keys(F).forEach(function(k){F[k]='';});pintarFiltros();render();};
}
function pintarTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===TAB?'on':'')+'">'+t[1]+'</button>';}).join('');
  document.querySelectorAll('[data-t]').forEach(function(b){b.onclick=function(){TAB=b.dataset.t;render();};});
}
function render(){
  if(!D)return;
  pintarTabs();
  charts.forEach(function(c){c.destroy();});charts=[];
  var m=document.getElementById('main');
  document.getElementById('filters').classList.toggle('hide',TAB==='monitoreo');
  m.innerHTML=VISTAS[TAB]();
  (POST[TAB]||function(){})();
  activarOrden();
}

function kpi(l,v,s,c){return '<div class="card kpi"><div class="l">'+l+'</div><div class="v" style="'+(c?'color:var(--'+({g:'good',w:'warn',b:'bad'}[c])+')':'')+'">'+v+'</div><div class="s">'+(s||'&nbsp;')+'</div></div>';}
function tabla(head,rows,total){
  return '<div class="tbl"><table><thead><tr>'+head.map(function(h,i){return '<th'+(i===0?' class="t"':'')+'>'+h+'</th>';}).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody>'+(total?'<tfoot>'+total+'</tfoot>':'')+'</table></div>';
}
function activarOrden(){
  document.querySelectorAll('table').forEach(function(t){
    t.querySelectorAll('th').forEach(function(th,i){th.onclick=function(){
      var tb=t.tBodies[0];if(!tb)return;var rows=[].slice.call(tb.rows);var dir=th.dataset.d==='a'?-1:1;th.dataset.d=dir===1?'a':'d';
      rows.sort(function(a,b){var x=a.cells[i].dataset.v!=null?a.cells[i].dataset.v:a.cells[i].textContent,y=b.cells[i].dataset.v!=null?b.cells[i].dataset.v:b.cells[i].textContent;
        var nx=parseFloat(String(x).replace('%','')),ny=parseFloat(String(y).replace('%',''));
        if(!isNaN(nx)&&!isNaN(ny))return (nx-ny)*dir;return String(x).localeCompare(String(y))*dir;});
      rows.forEach(function(r){tb.appendChild(r);});
    };});
  });
}
function filaRes(nombre,r,extra){
  return '<tr><td class="t">'+esc(nombre)+'</td><td>'+r.n+'</td><td data-v="'+r.nota+'">'+pill(r.nota)+'</td><td data-v="'+r.pec+'">'+pct(r.pec)+'</td><td>'+pct(r.neg)+'</td><td>'+pct(r.venta)+'</td><td>'+pct(r.cierre)+'</td><td>'+pct(r.exp)+'</td><td>'+pct(r.fb)+'</td>'+(extra||'')+'</tr>';
}
var HEAD_RES=['# Evas','Nota','PEC global','CUM Negociación','CUM Venta','CUM Cierre','CUM Exp. cliente','% con feedback'];

function chart(id,cfg){
  var el=document.getElementById(id);if(!el||!window.Chart)return;
  Chart.defaults.color=css('--muted');Chart.defaults.borderColor=css('--line');Chart.defaults.font.family='system-ui,Segoe UI,Arial';
  charts.push(new Chart(el,cfg));
}
var PAL=function(){return ['--c1','--c2','--c3','--c4','--c5','--c6'].map(css);};
var pctAxis={min:0,max:1,ticks:{callback:function(v){return Math.round(v*100)+'%';}}};

/* ===== Vistas ===== */
var VISTAS={}, POST={};

VISTAS.resumen=function(){
  var a=evaF(), r=resumen(a), fb=fbF();
  if(!a.length&&!fb.length)return '<div class="card">Sin datos para los filtros seleccionados.</div>';
  var porCamp=groupBy(a,function(e){return e.campana||'(sin campaña)';});
  var porSup=groupBy(a,function(e){return e.supervisor||'(sin supervisor)';});
  return '<div class="grid kpis">'+
    kpi('Evaluaciones',r.n,count(a,function(e){return e.tipo;}).map(function(x){return x[0]+': '+x[1];}).join(' · '))+
    kpi('Nota calidad',pct(r.nota),'promedio ponderado',cls(r.nota))+
    kpi('PEC global',pct(r.pec),'UF '+pct(r.uf,0)+' · NEG '+pct(r.ecNeg,0)+' · CUM '+pct(r.ecCum,0),cls(r.pec))+
    kpi('ENC (encuesta)',pct(r.enc),'Fluidez, despedida, clima')+
    kpi('CUM Negociación',pct(r.neg),'',cls(r.neg))+
    kpi('CUM Cierre venta',pct(r.cierre),'',cls(r.cierre))+
    kpi('CUM Exp. cliente',pct(r.exp),'',cls(r.exp))+
    kpi('Feedbacks',fb.length,pct(r.fb)+' de evaluaciones con feedback')+
  '</div><div class="grid two" style="margin-top:14px">'+
    '<div class="card"><h3>Nota por semana</h3><div class="chart"><canvas id="chSem"></canvas></div></div>'+
    '<div class="card"><h3>Cumplimiento por bloque</h3><div class="chart"><canvas id="chBloq"></canvas></div></div>'+
  '</div><div class="card" style="margin-top:14px"><h3>1. Resultados por campaña</h3>'+
    tabla(['Campaña'].concat(HEAD_RES),Object.keys(porCamp).sort().map(function(k){return filaRes(k,resumen(porCamp[k]));}),filaRes('Total general',r).replace('<tr>','<tr class="total">'))+
  '</div><div class="card" style="margin-top:14px"><h3>2. Resultados por supervisor</h3>'+
    tabla(['Supervisor'].concat(HEAD_RES),Object.keys(porSup).sort().map(function(k){return filaRes(k,resumen(porSup[k]));}),filaRes('Total general',r).replace('<tr>','<tr class="total">'))+'</div>';
};
POST.resumen=function(){
  var a=evaF(),g=groupBy(a,function(e){return e.sem;}),ks=Object.keys(g).sort();
  var p=PAL();
  chart('chSem',{type:'bar',data:{labels:ks.map(function(k){return 'Sem '+k;}),datasets:[{label:'Nota',data:ks.map(function(k){return resumen(g[k]).nota;}),backgroundColor:p[0],borderRadius:6},{label:'PEC',data:ks.map(function(k){return resumen(g[k]).pec;}),backgroundColor:p[1],borderRadius:6}]},options:{maintainAspectRatio:false,scales:{y:pctAxis},plugins:{tooltip:{callbacks:{label:function(c){return c.dataset.label+': '+pct(c.raw);}}}}}});
  var r=resumen(a);
  chart('chBloq',{type:'bar',data:{labels:['Negociación','Venta','Cierre','Exp. cliente','UF','NEG (EC)','CUM (EC)','ENC'],datasets:[{data:[r.neg,r.venta,r.cierre,r.exp,r.uf,r.ecNeg,r.ecCum,r.enc],backgroundColor:[p[0],p[0],p[0],p[0],p[1],p[1],p[1],p[2]],borderRadius:6}]},options:{indexAxis:'y',maintainAspectRatio:false,scales:{x:pctAxis},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return pct(c.raw);}}}}}});
};

function statsItems(a){
  return ITEMS.map(function(it,i){
    var c=0,n=0,na=0;a.forEach(function(e){if(it[1]==='venta'&&e.tipo!=='Venta')return;var v=e.items.charAt(i);if(v==='C')c++;else if(v==='N')n++;else na++;});
    return {nombre:it[0],bloque:it[1],c:c,n:n,na:na,p:(c+n)?c/(c+n):null,pv:it[2],pnv:it[3]};
  });
}
VISTAS.pauta=function(){
  var a=evaF(),st=statsItems(a),camps=uniq(a.map(function(e){return e.campana;}));
  var porC={};camps.forEach(function(c){porC[c]=statsItems(a.filter(function(e){return e.campana===c;}));});
  var rows=[];
  Object.keys(BLOQUES).forEach(function(b){
    var blk=a.map(function(e){return b==='neg'?e.cNeg:b==='venta'?e.cVenta:b==='cierre'?e.cCierre:e.cExp;});
    rows.push('<tr class="total"><td class="t">'+BLOQUES[b]+'</td><td></td><td></td><td>'+pill(avg(blk))+'</td><td></td><td></td>'+camps.map(function(c){var x=a.filter(function(e){return e.campana===c;}).map(function(e){return b==='neg'?e.cNeg:b==='venta'?e.cVenta:b==='cierre'?e.cCierre:e.cExp;});return '<td>'+pct(avg(x))+'</td>';}).join('')+'</tr>');
    st.forEach(function(s,i){if(s.bloque!==b)return;

  var hoy=new Date();
  var rowsP=pend.map(function(p){var dd=Math.floor((hoy-new Date(p.fecha+'T00:00:00'))/864e5);return '<tr><td class="t" data-v="'+p.fecha+'">'+fdate(p.fecha)+'</td><td>'+dd+'</td><td class="t">'+esc(p.agente)+'</td><td class="t">'+esc(p.supervisor)+'</td><td class="t">'+esc(p.campana)+'</td><td class="t">'+esc(p.evaluador)+'</td><td>'+esc(p.dn)+'</td><td>'+esc(p.caso)+'</td><td>'+pill(p.nota)+'</td></tr>';});
  var sel=function(k,lab,opts,fmt){return '<label>'+lab+'<select data-fm="'+k+'">'+(k==='mes'?'':'<option value="">Todos</option>')+opts.map(function(v){return '<option value="'+esc(v)+'"'+(FM[k]===v?' selected':'')+'>'+esc(fmt?fmt(v):v)+'</option>';}).join('')+'</select></label>';};
  var cump=tot.prog?Math.min(1,tot.real/tot.prog):null;
  return '<div class="card"><div class="row"><div class="filters" style="padding:0;border:0;background:none">'+
    sel('mes','Mes',MON.meses.slice().reverse(),mesLabel)+sel('supervisor','Supervisor',uniq(MON.agentes.map(function(x){return x.supervisor;})))+sel('campana','Campaña',uniq(MON.agentes.map(function(x){return x.campana;})))+
    '<label>Mostrar<select data-fm="solo"><option value="">Todos</option><option value="1"'+(FM.solo?' selected':'')+'>Solo con pendientes</option></select></label></div><button id="btnLock">🔒 Bloquear</button></div>'+
    (MON.usaDotacion?'':'<div class="miss">No se encontró hoja de Dotación: los agentes se toman de las evaluaciones (no aparecen agentes sin ninguna evaluación).</div>')+'</div>'+
    '<div class="grid kpis" style="margin-top:14px">'+kpi('Evas programadas',tot.prog,MON.progSemana+' por agente por semana')+kpi('Evas realizadas',tot.real,'Venta '+tot.v+' · No venta '+tot.nv)+kpi('Pendientes',Math.max(0,tot.prog-tot.real),'',tot.prog>tot.real?'b':'g')+kpi('Cumplimiento',pct(cump),'',cls(cump))+kpi('Feedback pendiente',pend.length,'evaluaciones con errores sin feedback',pend.length?'w':'g')+'</div>'+
    '<div class="card" style="margin-top:14px"><h3>Control de evaluaciones por agente (realizadas / programadas)</h3>'+tabla(['Agente','Campaña','Supervisor','Estado','Sem 1','Sem 2','Sem 3','Sem 4','Sem 5','Prog.','Realiz.','Venta','No venta','Pendiente','Cumpl.','Con feedback'],rows)+'</div>'+
    '<div class="grid two" style="margin-top:14px"><div class="card"><h3>Productividad monitor por semana</h3>'+tabla(['Semana','Monitor','Días','Objetivo','# Evas','# Feedbacks','Cumpl. feedback','Cumpl. evas'],rowsS)+'</div>'+
    '<div class="card"><h3>Productividad monitor por día (meta '+MON.metaDiaria+')</h3>'+tabla(['Fecha','Día','Sem','Monitor','# Evas','# Feedbacks','Meta','Cumpl.'],rowsD)+'</div></div>'+
    '<div class="card" style="margin-top:14px"><h3>Evaluaciones con errores sin feedback</h3>'+(rowsP.length?tabla(['Fecha eva','Días','Agente','Supervisor','Campaña','Evaluador','DN','Caso','Nota'],rowsP):'<div class="muted">Todo al día 🎉</div>')+'</div>';
};
POST.monitoreo=function(){
  var b=document.getElementById('btnPass');
  if(b){var i=document.getElementById('pass');i.focus();b.onclick=function(){cargarMon(i.value);};i.onkeydown=function(e){if(e.key==='Enter')cargarMon(i.value);};return;}
  document.querySelectorAll('[data-fm]').forEach(function(s){s.onchange=function(){FM[s.dataset.fm]=s.value;render();};});
  document.getElementById('btnLock').onclick=function(){MON=null;CLAVE=null;render();};
};

document.getElementById('btnRef').onclick=function(){cargar(true);};
document.getElementById('btnTheme').onclick=function(){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';render();};
cargar(false);
</script>
